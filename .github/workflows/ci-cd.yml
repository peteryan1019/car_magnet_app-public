name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: auto_magnet_design

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: auto_magnet_design/.nvmrc
      - run: npm install --global pnpm@10.16.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:runtime
      - run: pnpm test:runtime
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:ci
      - run: pnpm audit --audit-level=high

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_VERCEL_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: auto_magnet_design/.nvmrc
      - name: Install deployment CLI
        run: npm install --global vercel@65.9.0
      - name: Pull production project configuration
        working-directory: .
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Stage production deployment
        working-directory: .
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prod --skip-domain --yes --force --no-wait --token="$VERCEL_TOKEN")
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> "$GITHUB_ENV"
      - name: Wait for hosted build and reject blocked deployments
        run: node scripts/wait-for-deployment.mjs "$DEPLOYMENT_URL"
      - name: Verify actual server runtime and health
        run: node scripts/verify-deployment.mjs "$DEPLOYMENT_URL"
      - name: Promote verified deployment
        working-directory: .
        run: vercel promote "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"
      - name: Verify production domain
        run: node scripts/verify-deployment.mjs https://car-magnet-app.vercel.app
